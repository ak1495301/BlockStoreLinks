android {
    namespace = "fuck.blockstorelinks.droidvendorssuck"
    compileSdk = 36

    defaultConfig {
        applicationId = "fuck.blockstorelinks.droidvendorssuck"
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
